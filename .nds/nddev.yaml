# std-0001 repository manifest — schema: `nddev schema manifest`.
apiVersion: nddev.ai/v1alpha4
kind: Repository
metadata:
  id: nddev-device-sync-observability
  locator: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability
  owner: rldyourmnd
spec:
  standard:
    id: std-0001
  role: component
  profiles:
  - rust
  - typescript
  - infrastructure
  system:
    id: nds
    root: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync
  portfolios:
  - portfolio:nddev-opennetwork
  provides:
  - name: telemetry
    source: crates/sdk/src/lib.rs
    direction: code-first
  modules:
  - .
  - crates/sdk
  adaptations:
  - docs/decisions/0001-nds-contract-locations.md
  extensions:
    nddev.standards-system:
      standards:
      - std-0001
  adapters:
  - claude
  - cursor
