[package]
name = "nddev-device-sync-telemetry"
version = "0.0.1-alpha.11"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[features]
default = []
browser-bindings = ["dep:tsify"]
native-spool = []
client-traces = ["dep:prost", "dep:opentelemetry-proto"]
otlp = ["dep:opentelemetry-otlp", "dep:url", "dep:reqwest", "dep:rustls"]

[dependencies]
prost = { version = "0.14", optional = true }
opentelemetry-proto = { version = "0.33.1", optional = true, default-features = false, features = ["gen-tonic-messages", "trace"] }
opentelemetry-otlp = { version = "0.33.1", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
url = { version = "2.5", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonschema = { version = "0.58.6", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
thiserror = "2.0"
uuid = { version = "1.27", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "=0.3.2"

[dev-dependencies]
prost = "0.14"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tsify = { version = "=0.5.8", default-features = false, features = ["js"], optional = true }
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
gloo-timers = { version = "0.4", features = ["futures"] }
futures = "0.3"
web-time = "1.1"
uuid = { version = "1.27", features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
