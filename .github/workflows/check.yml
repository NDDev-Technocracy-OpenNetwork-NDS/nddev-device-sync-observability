name: NDS observability checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.0'
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Prepare pinned source-check tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: just@1.59.0,cargo-shear@1.14.0
          fallback: none
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned quality tools
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          tools: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Fetch locked source dependencies without package hooks
        run: just setup
      - name: Check source without compiling
        run: just check
      - name: Run the native project commands
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: test
      - name: Retain the actual native test report
        if: ${{ !cancelled() && hashFiles('.nddev-reports/bun-test.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typescript-javascript-tests-${{ github.job }}-${{ github.run_attempt }}
          path: .nddev-reports/bun-test.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  merge-stops:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    with:
      hosted-runner: ubuntu-26.04
