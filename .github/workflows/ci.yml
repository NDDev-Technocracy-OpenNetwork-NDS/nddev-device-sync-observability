# The repository's check through the CI library nddev-ci: a pull request runs `just check`
# and `just test`, a push to dev `just verify`, on GitHub's runners (a public repository).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c92818085dff62e5e3aded10dc90efc13d85d3de # v0.6.167
    permissions:
      contents: read
    with:
      setup: true
      rust-version: 1.100.0
      rust-components: clippy,rustfmt
      rust-targets: wasm32-unknown-unknown
      bun-version: 1.4.4
      tools: cargo-shear@1.14.0
      tool-assets: .github/ci-tools.json
