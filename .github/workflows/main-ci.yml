name: main-ci

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.0'
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Prepare pinned source-check tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b
        with:
          tool: just@1.59.0,cargo-shear@1.14.0
          fallback: none
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned quality tools
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          tools: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-nextest@0.9.149
      - name: Fetch locked source dependencies without package hooks
        run: just setup
      - name: Check source without compiling
        run: just check
      - name: Run the native project commands
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: verify
      - name: Retain the actual native test report
        if: ${{ !cancelled() && hashFiles('.nddev-reports/bun-test.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: typescript-javascript-tests-${{ github.job }}-${{ github.run_attempt }}
          path: .nddev-reports/bun-test.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  android-targets:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target aarch64-linux-android,x86_64-linux-android
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-targets
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check native Android sink compilation
        run: |
          cargo clippy --locked -p nddev-device-sync-telemetry --all-targets --target aarch64-linux-android -- -D warnings
          cargo clippy --locked -p nddev-device-sync-telemetry --all-targets --target x86_64-linux-android -- -D warnings

  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.0'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.59.0'
      - name: Read immutable acceptance server source
        id: fixture
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import re,tomllib
          value=tomllib.load(open('acceptance-server.lock','rb'))
          assert value['source_repo']=='NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-server'
          assert re.fullmatch('[a-f0-9]{40}',value['source_commit'])
          print('commit='+value['source_commit'])
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-server
          ref: ${{ steps.fixture.outputs.commit }}
          path: .server-acceptance-source
          persist-credentials: false
      - name: Install bounded Fluent transport support
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          version: type=image,tag=29.9.1
      - name: Verify the selected Docker engine
        run: test "$(docker version --format '{{.Server.Version}}')" = '29.9.1'
      - name: Verify real pipeline and durable incident lifecycle
        env:
          NDS_SERVER_SOURCE_DIR: ${{ github.workspace }}/.server-acceptance-source
        run: just integration
