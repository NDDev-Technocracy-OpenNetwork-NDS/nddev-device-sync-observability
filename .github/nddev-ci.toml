schema = 1
profiles = ["rust", "typescript-javascript"]

[tools.rust]
command = ["rustc", "--version"]
pattern = "^rustc 1[.]99[.]1"

[commands.rust]
lint = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--jobs", "4", "--", "-D", "warnings"]
test = ["cargo", "test", "--locked", "--workspace", "--all-features", "--jobs", "4"]
doctest = ["cargo", "test", "--locked", "--workspace", "--doc", "--jobs", "4"]
build = ["cargo", "build", "--locked", "--workspace", "--release", "--jobs", "4"]
policy = ["cargo", "deny", "--locked", "check", "licenses", "sources"]

[commands.typescript-javascript]
toolchain = ["bun", "--version"]
format = ["bun", "x", "biome", "format", "crates/sdk/src"]
lint = ["bun", "run", "check"]
type = ["bun", "x", "tsc", "--noEmit"]
test = ["bun", "run", "check:generated"]
build = ["bun", "run", "generate"]

[not_applicable.typescript-javascript]
package = "Private browser I/O library; it is consumed in-tree and never published"

[timeouts]
rust = 900

[extras.advisories]
purpose = "Check the locked dependencies against current RustSec advisories"
command = ["cargo", "audit", "--deny", "warnings"]
timeout = 600

[extras.protocol-check]
purpose = "Consumer DTOs match the pinned immutable protocol source"
command = ["python3", "scripts/check-protocol.py"]
timeout = 300

[extras.sdk-check]
purpose = "SDK schema and event surface stays coherent"
command = ["python3", "scripts/check-sdk.py"]
timeout = 300

[extras.wasm-gate]
purpose = "Browser bindings compile for wasm32-unknown-unknown"
command = ["cargo", "clippy", "--locked", "-p", "nddev-device-sync-telemetry", "--features", "client-traces,browser-bindings", "--target", "wasm32-unknown-unknown", "--", "-D", "warnings"]
timeout = 600
